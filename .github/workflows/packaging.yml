name: Packaging check

# Builds the installers on every platform without publishing anything, so
# packaging problems show up long before a release. The release workflow
# (milestone M7) will reuse this matrix.

on:
  pull_request:
    branches: [develop]
    paths:
      - "crates/**"
      - "ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".node-version"
      - ".github/workflows/packaging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 on purpose: an AppImage runs on systems with the
          # same or a newer glibc than the one it was built against.
          - name: Linux x86_64 (AppImage)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
            artifact: linux-x86_64
          - name: macOS Apple Silicon (dmg)
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-aarch64
          - name: macOS Intel (dmg)
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x86_64
          - name: Windows x86_64 (NSIS)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the system libraries Tauri needs on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential curl wget file libfuse2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the toolchain pinned in rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: packaging-${{ matrix.target }}

      - name: Build the installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: List what was built
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release/bundle"
          find . -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) -exec ls -l {} \;
          find . -type f \( -name '*.AppImage' -o -name '*.dmg' -o -name '*.exe' \) -exec shasum -a 256 {} \;

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: damn-http-${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
