# cargo-deny configuration. Run with: cargo deny check
# Every dependency must be compatible with distributing Damn HTTP under Apache-2.0.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Add a license here only in the PR that introduces a dependency needing it,
# with a note in docs/project/DECISIONS.md if it is not a permissive license.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list is written ahead of the dependencies that will use it.
unused-allowed-license = "allow"

# Note for the PR that adds git2 (D-004): libgit2-sys declares "MIT OR Apache-2.0"
# but bundles libgit2, which is GPL-2.0 with a linking exception. cargo-deny cannot
# see that from crate metadata. Record it here and in NOTICE in that PR.

[licenses.private]
# Our own unpublished workspace crates.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
